defaults:
  - config
  - _self_

# Native-SI, five-minute Minxiong H1-H100 protocol. Split files and time
# contracts are generated by the validated HEC-RAS dataset pipeline.
data_dir: /mnt/8tb_hdd2/joyce/hecras-dataset/Linux_RAS_v66/Minxiong/outputs_si5m_v2_h1h100/HGN_dataset
hydrograph_ids_file: train_ids.txt
num_training_samples: 70
n_time_steps: 2
delta_t: 300.0
precipitation_unit_conversion: 2.7777777777777776e-7
local_source_runoff_mode: full_area

batch_size: 1
# Full publication training budget. Screening runs override these with the
# smaller predeclared 10-epoch x 500-batch budget.
epochs: 30
max_train_batches: 1000
num_dataloader_workers: 0
lr: 0.0001
lr_decay_rate: 0.9999979
use_apex: false
amp: false
wandb_mode: disabled
watch_model: false

# The zoning collaborator supplies these immutable labels. They are loaded for
# scope selection and reporting, not recomputed or optimized here.
use_fidelity_zones: true
zone_label_file: zone_label.txt
zone_weight_file: zone_weight.txt
zone_loss_weight: 0.0
log_zone_metrics: true

# Retain HydroGraphNet's graph-level physics term as the common base objective.
use_physics_loss: true
physics_loss_weight: 1.0
