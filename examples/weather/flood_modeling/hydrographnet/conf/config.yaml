# Configuration file for HydroGraphNet training.
# This file is used by Hydra to configure the training run.

hydra:
  job:
    chdir: True  # Change directory to the job's working directory.
  run:
    dir: ./outputs_phy/  # Directory to save outputs.

# Data configuration: paths for training and testing datasets.
data_dir: ./data
test_dir: ./data/Test
hydrograph_ids_file: train.txt

# Training configuration.
seed: 0
batch_size: 1
epochs: 100
num_training_samples: 400
max_train_batches: null
num_training_time_steps: 300
lr: 0.0001
lr_decay_rate: 0.9999979
weight_decay: 0.0001
num_input_features: 16    # Number of node input features.
num_output_features: 2    # Number of output features (e.g., depth and volume differences).
num_edge_features: 3      # Number of edge features.

# Noise settings.
noise_type: "none"        # Options: "none", "pushforward", "only_last", "correlated", etc.
n_time_steps: 2           # Number of time steps in the sliding window.

# Physics loss settings.
use_physics_loss: true
delta_t: 1200.0
physics_loss_weight: 1.0

# Fidelity-zone configuration. This is intentionally separate from any future
# edge-informed local-conservation work.
use_fidelity_zones: false
zone_label_file: zone_label.txt
zone_weight_file: zone_weight.txt
zone_loss_weight: 0.0
log_zone_metrics: false

# Edge-local proxy branch. Disabled by default so node-zone experiments and
# baseline HydroGraphNet runs stay separate.
use_edge_local_proxy: false
edge_local_loss_weight: 0.0

# HEC-RAS true-face branch. This is separate from the kNN/VX/VY proxy branch.
# Keep it disabled unless the HEC-RAS HDF face-velocity event mapping has been
# reviewed for the selected HydroGraphNet hydrographs.
use_hecras_face_loss: false
hecras_face_loss_weight: 0.0
hecras_face_graph_file: null
hecras_face_velocity_file: null
hecras_face_velocity_path: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/per2/Face Velocity"
hecras_face_time_offset: 0
hecras_face_zone_mode: zone_weight  # zone_weight, high, or all
hecras_face_calibrate_to_target: true

# Geometry-only HEC-RAS true-face regularization. This uses only true face
# connectivity, face length, and cell area; it does not consume event-specific
# HDF face velocity, so it is safer when HDF forcing does not fully match HGN.
use_hecras_face_geometry_loss: false
hecras_face_geometry_loss_weight: 0.0
hecras_face_geometry_zone_mode: zone_weight  # zone_weight, high/high_adjacent, or all
hecras_face_geometry_wet_depth_threshold: null  # physical water depth threshold; null disables wet/dry masking
hecras_face_geometry_reference_mode: smooth  # smooth or target_gradient

# Performance and optimization configurations.
use_apex: True            # Use NVIDIA Apex for mixed precision if available.
amp: False                # Automatic mixed precision flag.
jit: False                # Use TorchScript JIT compilation.
num_dataloader_workers: 4
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# WandB logging configuration.
wandb_mode: disabled
watch_model: False

# Checkpoint path.
ckpt_path: "./checkpoints_phy"

# Test and visualization configuration.
num_test_samples: 10
num_test_time_steps: 30
