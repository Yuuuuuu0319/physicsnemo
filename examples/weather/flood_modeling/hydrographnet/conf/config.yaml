# Configuration file for HydroGraphNet training.
# This file is used by Hydra to configure the training run.

hydra:
  job:
    chdir: True  # Change directory to the job's working directory.
  run:
    dir: ./outputs_phy/  # Directory to save outputs.

# Data configuration: paths for training and testing datasets.
data_dir: ./data
test_dir: ./data/Test
hydrograph_ids_file: train.txt

# Training configuration.
seed: 0
batch_size: 1
epochs: 100
num_training_samples: 400
max_train_batches: null
num_training_time_steps: 300
lr: 0.0001
lr_decay_rate: 0.9999979
weight_decay: 0.0001
num_input_features: 16    # Number of node input features.
num_output_features: 2    # Number of output features (e.g., depth and volume differences).
num_edge_features: 3      # Number of edge features.

# Noise settings.
noise_type: "none"        # Options: "none", "pushforward", "only_last", "correlated", etc.
n_time_steps: 2           # Number of time steps in the sliding window.
# Optional sample-count overrides. When null, validated datasets can provide
# these values through hgn_dataset_validation.json; legacy data keeps 72/25.
dynamic_skip_steps: null
post_peak_steps: null

# Physics loss settings.
use_physics_loss: true
delta_t: 1200.0
physics_loss_weight: 1.0
# Raw M80_Pr is mm/h. Official SI data uses mm/h -> m/s (2.7778e-7).
# Minxiong US-customary runs must override this with 9.113444e-7 (ft/s).
precipitation_unit_conversion: 2.7778e-7
# Official behavior multiplies rain by M80_IP. Minxiong HDF diagnostics show
# spatially uniform cumulative precipitation, so formal runs use full_area.
local_source_runoff_mode: ip_fraction  # ip_fraction or full_area
require_node_precipitation: false

# Fidelity-zone configuration. This is intentionally separate from any future
# edge-informed local-conservation work.
use_fidelity_zones: false
zone_label_file: zone_label.txt
zone_weight_file: zone_weight.txt
zone_loss_weight: 0.0
log_zone_metrics: false

# Edge-local proxy branch. Disabled by default so node-zone experiments and
# baseline HydroGraphNet runs stay separate.
use_edge_local_proxy: false
edge_local_loss_weight: 0.0

# HEC-RAS true-face branch. This is separate from the kNN/VX/VY proxy branch.
# Keep it disabled unless the HEC-RAS HDF face-velocity event mapping has been
# reviewed for the selected HydroGraphNet hydrographs.
use_hecras_face_loss: false
hecras_face_loss_weight: 0.0
hecras_face_graph_file: null
hecras_face_velocity_file: null
hecras_face_velocity_glob: null
hecras_face_velocity_path: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/per2/Face Velocity"
hecras_face_time_offset: 0
hecras_face_zone_mode: zone_weight  # zone_weight, high, or all
hecras_face_calibrate_to_target: true

# Geometry-only HEC-RAS true-face regularization. This uses only true face
# connectivity, face length, and cell area; it does not consume event-specific
# HDF face velocity, so it is safer when HDF forcing does not fully match HGN.
use_hecras_face_geometry_loss: false
hecras_face_geometry_loss_weight: 0.0
hecras_face_geometry_zone_mode: zone_weight  # zone_weight, high/high_adjacent, or all
hecras_face_geometry_wet_depth_threshold: null  # physical water depth threshold; null disables wet/dry masking
hecras_face_geometry_reference_mode: smooth  # smooth, target_gradient, source_smooth, or source_target_gradient

# Formal HEC-RAS cell-budget branch. Five-minute formal targets must come from
# interval-resolved Face Flow Period Average plus known raster precipitation,
# collapsed to cells without exposing edge values to the model. Directly
# integrating point-sampled five-minute Cell Flow Balance is not allowed.
use_hecras_cell_balance_loss: false
hecras_cell_balance_loss_weight: 0.0
hecras_cell_balance_zone_mode: zone_weight  # zone_weight, high, or all
hecras_cell_balance_loss_normalization: none  # none, volume_std, or target_rms
hecras_cell_balance_glob: null
hecras_cell_balance_npz: null
hecras_cell_balance_target_dir: null
hecras_cell_balance_npz_key_suffix: "_cell_balance_storage_delta"
# Null uses the validated warm-up skip for sharded five-minute targets and 0
# for legacy NPZ/HDF targets that are already trimmed to model time.
hecras_cell_balance_time_offset: null
hecras_cell_balance_path: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/per2/Cell Flow Balance"
hecras_precipitation_path: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/per2/Cell Cumulative Precipitation Depth"
hecras_result_time_path: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/Time"
hecras_cell_xy_path: "Geometry/2D Flow Areas/per2/Cells Center Coordinate"
hecras_cell_surface_area_path: "Geometry/2D Flow Areas/per2/Cells Surface Area"

# Formal HEC-RAS edge-flow branch. This uses a precomputed target reconstructed
# from native HEC-RAS Face Flow over HGN intervals. It is intentionally separate
# from the Cell Flow Balance branch so edge-informed ablations do not mix with
# cell-level targets.
use_hecras_edge_flow_loss: false
hecras_edge_flow_loss_weight: 0.0
hecras_edge_flow_zone_mode: zone_weight  # zone_weight, high, high_interior, or all
hecras_edge_flow_npz: null
hecras_conservative_edge_target_dir: null
hecras_edge_flow_face_stats_npz: null
hecras_edge_flow_scale_stats_npz: null
hecras_edge_flow_mode: all_touching  # all_touching, internal_plus_boundary_source, or conservative_sharded
# Null automatically uses the dataset time contract's warm-up skip for formal
# sharded targets; legacy pre-trimmed targets can explicitly use 0.
hecras_edge_flow_time_offset: null

# Experimental model-side internal edge-flux branch. Unlike
# use_hecras_edge_flow_loss, this adds a small edge head that predicts signed
# interval flux on the HEC-RAS internal face graph. The loss closes
# node-volume prediction with explicit boundary/source terms.
use_hecras_edge_flux_head: false
hecras_edge_flux_head_loss_weight: 0.0
hecras_edge_flux_head_zone_mode: zone_weight  # zone_weight, zone_weighted, high, high_interior, or all
hecras_edge_flux_head_zone_high_weight: 1.0
hecras_edge_flux_head_zone_low_weight: 1.0
hecras_edge_flux_head_closure_target_weight: 1.0
hecras_edge_flux_head_divergence_target_weight: 1.0
hecras_edge_flux_head_face_target_weight: 0.0
hecras_edge_flux_head_face_zone_mode: all  # direct Face Flow supervision scope, independent of local closure scope
hecras_edge_flux_head_face_loss_normalization: none  # none, target_rms, asinh_target_rms, signed_log1p_target_rms, per_face_rms, asinh_per_face_rms, or signed_log1p_per_face_rms
hecras_edge_flux_head_node_loss_normalization: none  # none, target_rms, or volume_std
hecras_edge_flux_head_storage_delta_mode: dataset_volume  # dataset_volume, legacy capped_volume, or area_extrapolated_volume
hecras_edge_flux_head_closure_granularity: node  # node or connected_control_volume
hecras_edge_flux_head_hidden_dim: 128
hecras_edge_flux_head_num_hidden_layers: 2
hecras_edge_flux_head_scale: 1.0
hecras_edge_flux_head_use_face_normal: false
hecras_edge_flux_head_use_surface_features: false
hecras_edge_flux_head_use_physical_surface_features: false
hecras_edge_flux_head_use_previous_face_flow: false
hecras_edge_flux_head_use_edge_physical_features: false
hecras_edge_flux_head_use_node_prediction_features: false
hecras_edge_flux_head_output_mode: raw  # raw, per_face_rms, transition_rms, face_transition_rms, asinh_*, or signed_log1p_*
hecras_edge_flux_head_active_face_mode: all  # all, zone4_touch, or high_interior_touch
freeze_mesh_model_for_edge_flux_head: false

# Differentiable exact conservation for connected high-fidelity interior
# control volumes. The projection constraint uses only predicted storage and
# known precipitation, never future HEC-RAS Face Flow or boundary targets.
# Face Flow remains a training target after projection. Keep disabled for the
# HydroGraphNet baseline and soft edge-head ablations.
use_selective_hard_conservation: false
selective_hard_conservation_loss_weight: 0.0
selective_hard_conservation_raw_control_volume_weight: 0.0
selective_hard_conservation_correction_weight_mode: training_face_rms_squared  # or equal
selective_hard_conservation_face_loss_normalization: asinh_per_face_rms
selective_hard_conservation_node_loss_normalization: volume_std

# Optional explicit autoregressive training. Values greater than one attach
# consecutive ground-truth states and forcing to each train sample. The
# selective_projected mode feeds differentiable edge-divergence volume changes
# back only to the fixed high-fidelity interior control volumes. Batch size 1
# and noise_type=none are currently required. Defaults preserve all legacy
# one-step behavior.
training_rollout_steps: 1
training_rollout_discount: 1.0
training_rollout_backprop_through_time: true
training_rollout_volume_feedback: node  # node or selective_projected
training_rollout_projected_volume_alpha: 1.0

# Performance and optimization configurations.
use_apex: True            # Use NVIDIA Apex for mixed precision if available.
amp: False                # Automatic mixed precision flag.
jit: False                # Use TorchScript JIT compilation.
num_dataloader_workers: 4
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# WandB logging configuration.
wandb_mode: disabled
watch_model: False

# Checkpoint path.
ckpt_path: "./checkpoints_phy"
# Optional node-backbone warm start. A checkpoint in ckpt_path, when present,
# still overrides this initialization during normal resume.
init_mesh_checkpoint_path: null
init_mesh_checkpoint_epoch: null

# Test and visualization configuration.
num_test_samples: 10
num_test_time_steps: 30
